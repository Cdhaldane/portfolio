<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2d2d2a" />
  <meta name="description"
    content="Charlie Haldane builds fast, well-designed websites and web apps for businesses in Peterborough, Ontario. React, Webflow & full-stack development." />

  <!-- Open Graph / social preview. Static in index.html so crawlers that don't
       run JS (Facebook, LinkedIn, iMessage, Slack) still get a proper card on
       every route. React Helmet refines these per-page for JS-capable clients. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Charlie Haldane" />
  <meta property="og:title" content="Charlie Haldane — Web Developer in Peterborough, Ontario" />
  <meta property="og:description"
    content="Software engineer & designer crafting fast, expressive web experiences. React & full-stack development from Peterborough, Ontario." />
  <meta property="og:url" content="https://charliehaldane.ca/" />
  <meta property="og:image" content="https://charliehaldane.ca/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Charlie Haldane — Web Developer in Peterborough, Ontario" />
  <meta name="twitter:description"
    content="Software engineer & designer crafting fast, expressive web experiences. React & full-stack development from Peterborough, Ontario." />
  <meta name="twitter:image" content="https://charliehaldane.ca/og-image.png" />

  <link rel="icon" href="%PUBLIC_URL%/C_Logo.png" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/C_Logo.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <link rel="canonical" href="https://charliehaldane.ca/" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=IBM+Plex+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700;800;900&family=Kalam&family=Luxurious+Roman&family=Moon+Dance&family=Nanum+Brush+Script&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <title>Charlie Haldane — Web Developer in Peterborough, Ontario</title>

  <!-- Set the colour theme before first paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("isDarkMode");
        var dark = stored !== null
          ? JSON.parse(stored)
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>

  <!-- Local business structured data for search engines -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Charlie Haldane Web Development",
      "description": "Web design and development for businesses in Peterborough, Ontario.",
      "url": "https://charliehaldane.ca",
      "areaServed": {
        "@type": "City",
        "name": "Peterborough",
        "containedInPlace": { "@type": "State", "name": "Ontario" }
      },
      "founder": { "@type": "Person", "name": "Charlie Haldane" },
      "knowsAbout": ["Web Development", "React", "Webflow", "UI/UX Design", "Full Stack Development"],
      "sameAs": [
        "https://github.com/Cdhaldane",
        "https://www.linkedin.com/in/charliehaldaneuottawa/",
        "https://www.instagram.com/charliedhaldane/"
      ]
    }
  </script>
</head>

<body>
  <div id="root"></div>

</body>
